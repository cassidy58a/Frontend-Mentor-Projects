<!DOCTYPE html>
<!-- https://www.frontendmentor.io/learning-paths/building-responsive-layouts--z1qCXVqkD/challenge/65e71e1c17e502f0b6ce64b0/start -->
<!-- Create product preview website that looks close to the given image (/images/desktop-preview.jpg)-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
	body {
		background-color: #F6CAC0;
		place-items: center;
	}
	.container {
		display: flex;
		border-radius: 15px;
	}
	.container div {
		background-color: white;
		border-radius: 15px;
		padding: 5px;
	}
	.button {
		border: none;
		background-color: green;
		color: white;
		border-radius: 15px;
		padding: 15px 32px;
		margin: auto;
		display: block;
	}
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
	<div class="container">
		<div class="container">
			<div style="padding=0;">
				<img src="images/image-product-desktop.jpg"
				style="width: 300px; height: 400px; border-radius: 15px;">
			</div>
			<div>
			<p style="color: gray; font-family: Verdana;">PERFUME</p>

			<h1 style="font-family: Times New Roman;">Gabrielle<br>
				Essence Eau<br>
				De Parfum</h1>

			<p style="color: gray;">A floral, solar and voluptuous<br>
									interpretation composed by<br>
									Olivier Polge, Perfumer-Creator<br>
									for the House of CHANEL.</p>

			<h1 style="color: green;">$149.99
			<span style="font-family: Arial; font-size:10px; color: gray;">            <s>$169.99</s></span></h1>
			
			<button class="button">Add to Cart</button>
			</div>
		</div>
	</div>
 
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by Cassidy.
  </footer>
</body>
</html>
